name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q "*.zip" -d extracted_project
        # لو المشروع جوه مجلد رئيسي جوه الـ ZIP، هننقله للـ root مباشرة
        find extracted_project -mindepth 2 -maxdepth 2 -exec mv {} . \; || true
        cp -r extracted_project/* . || true

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: "11076708"
        packages: "platforms;android-34"

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quoridor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
