name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q "*.zip" -d extracted_project
        # دوّر على مكان settings.gradle.kts وحدد مجلد المشروع
        PROJECT_DIR=$(dirname "$(find extracted_project -name 'settings.gradle*' | head -n 1)")
        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: "platforms;android-35 build-tools;35.0.0"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.9"

    - name: Build APK with Gradle
      working-directory: ${{ env.PROJECT_DIR }}
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Quoridor-APK
        path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
